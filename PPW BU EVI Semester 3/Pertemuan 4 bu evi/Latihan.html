<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Formulir</title>
</head>
<body>
    <form action="" name="frmPendaftaran" method="post">
        <fieldset>
            <label for="lblmail">Email :</label>
            <input type="email" name="txtmail" id="txtmail" placeholder="namaemail@namadomain.jenisdomain"><br>

            <label for="lblnum">Jumlah Saudara :</label>
            <input type="number" name="txtnum" id="textnum" min="0" max="15"><br>

            <label for="lblweek">Pilih Minggu Pertahun :</label>
            <input type="week" name="txtweek" id="txtweek"><br>

            <label for="lblBln">Pilih Bulan :</label>
            <input type="month" name="txtmonth" id="txtmonth"><br>

            <label for="lbltgl">Tanggal Lahir :</label>
            <input type="date" name="dtLhr" id="dtLhr"><br>

            <label for="lbldtLc">Tanggal dan Waktu :</label>
            <input type="datetime-local" name="dtLc" id="dtLc">
        </fieldset>
    </form>
</body>
</html>
